backend:
  initialization:
    meshsize: 512
  density_contrast:
    smoothing_radius: 10.0
    resampler: tsc
    interlacing: 3
    compensate: True

tpcf:
  compute:
    edges: # s and mu edges for the correlation functions
      - !np.arange [0, 151, 1]
      - !np.linspace [-1, 1, 120]
    mode: smu
    compute_sepsavg: False # Ensure consistency with different computations
    los: z
    nthreads: 1
    gpu: False
  load:
    project: True
    ells: [0, 2]

spectrum:
  compute:
    edges:
      step: 0.001
    ells: [0, 2, 4]
    resampler: tsc
    interlacing: 3
    compensate: True
    los: z

bispectrum:
  compute:
    basis: scoccimarro
    edges:
      min: 0.02
      max: 0.20
      step: 0.02
    buffer_size: 30
    resampler: tsc
    interlacing: 3
    compensate: True
    los: z

ds_xiqg:
  initialization:
    nquantiles: 5
  compute:
    data_type: correlation
    cross: True
    edges:
      - !np.arange [0, 31, 1]
      - !np.linspace [-1, 1, 120]
    mode: smu
    compute_sepsavg: False
    los: z
    nthreads: 1
    gpu: False
  load:
    project: True
    ells: [0, 2]

ds_xiqq:
  initialization:
    nquantiles: 5
  compute:
    data_type: correlation
    cross: False
    edges:
      - !np.arange [0, 31, 1]
      - !np.linspace [-1, 1, 120]
    mode: smu
    compute_sepsavg: False
    los: z
    nthreads: 1
    gpu: False
  load:
    project: True
    ells: [0, 2]

ds_pkqg:
  initialization:
    nquantiles: 5
  compute:
    data_type: power
    cross: True
    edges:
      step: 0.001
    ells: [0, 2, 4]
    resampler: tsc
    interlacing: 3
    compensate: True
    los: z

ds_pkqq:
  initialization:
    nquantiles: 5
  compute:
    data_type: power
    cross: False
    edges:
      step: 0.001
    ells: [0, 2, 4]
    resampler: tsc
    interlacing: 3
    compensate: True
    los: z

wst-j4:
  initialization:
    J: 4
    L: 4
    sigma: 0.8
    frontend: torch
    kymatio_object: # Empty value defaults to None
