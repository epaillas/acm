backend:
  initialization:
    meshsize: 512
  density_contrast:
    smoothing_radius: 10.0
    resampler: tsc
    interlacing: 3
    compensate: True

tpcf:
  compute:
    edges: # s and mu edges for the correlation functions
      - !np.arange [0, 151, 1]
      - !np.linspace [-1, 1, 120]
    mode: smu
    compute_sepsavg: False # Ensure consistency with different computations
    los: z
    nthreads: 1
    gpu: False
  load:
    project: True
    ells: [0, 2]
  compress:
    get:
      ells: [0, 2]
    rebin: 
      s: 3

spectrum:
  compute:
    edges:
      step: 0.001
    ells: [0, 2, 4]
    resampler: tsc
    interlacing: 3
    compensate: True
    los: z
  compress:
    get:
      ells: [0, 2]
    rebin: 
      k: 3
    select:
      k: !python/tuple [
        0.013, # 2 * pi / 500 - lower limit fixed by small boxsize
        0.731, # pi * 512 / 2200 - Higher limit fixed by Nyquist frequency of the largest boxsize
      ]

bispectrum:
  compute:
    basis: scoccimarro
    edges:
      min: 0.02
      max: 0.20
      step: 0.02
    buffer_size: 30
    resampler: tsc
    interlacing: 3
    compensate: True
    los: z

ds_xiqg:
  initialization:
    nquantiles: 5
  compute:
    data_type: correlation
    cross: True
    edges:
      - !np.arange [0, 31, 1]
      - !np.linspace [-1, 1, 120]
    mode: smu
    compute_sepsavg: False
    los: z
    nthreads: 1
    gpu: False
  load:
    project: True
    ells: [0, 2]
  compress:
    get:
      ells: [0, 2]
      quantiles: [0, 1, 3, 4]
    rebin: 
      s: 3

ds_xiqq:
  initialization:
    nquantiles: 5
