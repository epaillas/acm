name: CI - Validate
# Lint, Typecheck, Format, Test Suite, CRAP Score

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Run linter
        run: uvx ruff check .
      - name: Run formatter
        run: uvx ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Get number of type errors # First run is to get the number of errors without failing
        run: uvx ty check acm --quiet --exit-zero --python-version 3.13
      - name: Run type checker # Second run is to get the output in GitHub format for annotations
        run: uvx ty check acm --output-format github  --python-version 3.13

  test-suite:
    name: Test Suite
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: ./.github/workflows/test-suite.yaml
    permissions:
      contents: read
      checks: write
    with:
      checkout_ref: ${{ github.sha }}

  crapscore:
    name: CRAP Score
    runs-on: ubuntu-latest
    needs: [test-suite]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Download artifacts from test suite
        uses: actions/download-artifact@v8
        with:
          name: coverage-3.13-ubuntu-latest
      - name: Run crap score
        id: crapscore
        continue-on-error: true
        run: uvx crap4py acm/ --lcov lcov.info --max-crap 10 >> crapscore.txt
      - name: Make summary
        run: |
          {
            echo "### CRAP Score"
            echo ""
            echo "<details>"
            echo "<summary>Click to expand</summary>"
            echo " "
            echo '```'
            if [ -f crapscore.txt ]; then
              cat crapscore.txt
            else
              echo "CRAP score not available"
            fi
            echo '```'
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY
      # - name: Fail if CRAP score is too high
      #   if: ${{ steps.crapscore.outcome == 'failure' }}
      #   run: echo "CRAP score is too high" && exit 1
