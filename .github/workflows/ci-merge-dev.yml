name: Pipeline update on dev branch merge
description: |
  Updates coverage value and version on dev branch merge.

on:
  pull_request:
    branches: [ "dev" ]
    types: [ closed ]
    paths:
      - "acm/**"

jobs:
  bump-coverage:
    if: ${{ github.event.pull_request.merged == true }}
    secrets: inherit
    uses: ./.github/workflows/check-coverage.yml
    permissions:
      pull-requests: read
      contents: write
    with:
      update_coverage: true

  bump-dev:
    if: ${{ github.event.pull_request.merged == true }}
    secrets: inherit
    uses: ./.github/workflows/bump-version.yml
    permissions:
      pull-requests: read
      contents: write
    with:
      bump_type: dev
      add-tag: false