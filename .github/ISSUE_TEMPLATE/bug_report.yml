name: Bug Report
description: Something is not working as expected
type: bug
labels: ["needs-triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the details below to help us understand the issue.

  - type: textarea
    id: description
    attributes:
      label: What went wrong?
      description: Describe what happened in plain language.
      placeholder: "The hello_world() function returned 'Hello, Universe!' instead of 'Hello, World!'"
    validations:
        required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Please provide a step-by-step description of how to reproduce the issue.
      placeholder: |
        1.
        2.
        3.

        What happened:
        What you expected:
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Please specify the version of the software you are using when you encountered the bug.
      placeholder: e.g., 1.0.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Your setup
      description: Please provide details about your environment, such as operating system, Python version, and any relevant dependencies.
      placeholder: "OS: Windows 10, Python: 3.8.0, Dependencies: numpy, pandas"
    validations:
      required: true

  - type: textarea
    id: solutions
    attributes:
      label: Possible Solutions
      description: If you have any ideas on how to fix the issue, please share them here.
      placeholder: Describe any possible solutions you have in mind.

  - type: textarea
    id: additional-information
    attributes:
      label: Additional Information
      description: If there is any other information that might be helpful in diagnosing the issue, please include it here.
      placeholder: "Any other relevant information, logs, or screenshots."

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting
      options:
        - label: I've searched existing issues and discussions and this hasn't been reported yet
          required: true
        - label: I've reviewed this report and have completed it as fully as I can
          required: true
