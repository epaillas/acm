tpcf:
  compute:
    edges: 
      - !np.arange [0, 151, 1]
      - !np.linspace [-1, 1, 120]
    mode: smu
    compute_sepsavg: False

spectrum:
  compute:
    edges:
      step: 0.001
    ells: [0, 2, 4]

bispectrum:
  initialization:
    cellsize: 5.0
  compute:
    edges:
      min: 0.02
      max: 0.20
      step: 0.02
    buffer_size: 30
    resampler: tsc
    interlacing: 3
    compensate: True

ds_xiqg:
  initialization:
    cellsize: 5.0
    nquantiles: 5
  compute:
    data_type: correlation
    cross: True
    edges:
      - !np.arange [0, 151, 1]
      - !np.linspace [-1, 1, 120]
    mode: smu
    compute_sepsavg: False

ds_xiqq:
  initialization:
    cellsize: 5.0
    nquantiles: 5
  compute:
    data_type: correlation
    cross: False
    edges:
      - !np.arange [0, 151, 1]
      - !np.linspace [-1, 1, 120]
    mode: smu
    compute_sepsavg: False

ds_pkqg:
  initialization:
    cellsize: 5.0
    nquantiles: 5
  compute:
    data_type: power
    cross: True
    edges:
      step: 0.001
    ells: [0, 2, 4]

ds_pkqq:
  initialization:
    cellsize: 5.0
    nquantiles: 5
  compute:
    data_type: power
    cross: False
    edges:
      step: 0.001
    ells: [0, 2, 4]